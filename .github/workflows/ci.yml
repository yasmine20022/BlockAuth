name: CI/CD to Minikube
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build Docker image
        run: docker build -t blockauth-nodejs-app:latest .
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Start Minikube
        uses: medyagh/setup-minikube@latest
      - name: Build image inside Minikube
        run: |
          eval $(minikube docker-env)
          docker build -t blockauth-nodejs-app:latest .
      - name: Apply Kubernetes manifests if present
        run: |
          [ -d k8s ] && kubectl apply -f /tmp/devops-autopilot-k8s/deployment.yaml || echo "k8s/ not found, skipping"
      - name: Rollout status of deployment
        run: kubectl rollout status deployment/blockauth --timeout=60s || true
      - name: Create Kubernetes manifest
        run: |
          mkdir -p /tmp/devops-autopilot-k8s
          cat > /tmp/devops-autopilot-k8s/deployment.yaml <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: blockauth
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: blockauth
            template:
              metadata:
                labels:
                  app: blockauth
              spec:
                containers:
                  - name: blockauth
                    image: blockauth:latest
                    imagePullPolicy: Never
          EOF
